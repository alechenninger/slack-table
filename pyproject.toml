[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "slack-table"
version = "0.1.0"
description = "Convert pasted or piped tables into Slack-native table paste data."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
slack-table = "slack_table.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
